<section class="contact-section warm-section" id="contact" aria-labelledby="contact-heading">
  <h2 id="contact-heading" class="section-title" data-i18n="contactTitle">Contact</h2>
  <div class="contact-inner"><p data-i18n="contactIntro">For casting & professional enquiries</p><a class="contact-email text-link" href="mailto:tine.ugrin@gmail.com">tine.ugrin@gmail.com</a>
    <h3 data-i18n="contactFormTitle">Or send me a message</h3>
    <form name="portfolio-contact" method="POST" action="/thank-you/" data-netlify="true" netlify-honeypot="bot-field" id="contact-form">
      <input type="hidden" name="form-name" value="portfolio-contact"><input type="hidden" name="language" value="en" data-form-language>
      <p class="honeypot" aria-hidden="true"><label>Leave this empty<input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <div class="form-field"><label for="contact-name" data-i18n="formName">Your name</label><input id="contact-name" name="name" type="text" autocomplete="name" maxlength="120" required></div>
      <div class="form-field"><label for="contact-email" data-i18n="formEmail">Your email</label><input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
      <div class="form-field"><label for="contact-message" data-i18n="formMessage">Your message</label><textarea id="contact-message" name="message" rows="5" maxlength="5000" required></textarea></div>
      <button class="send-button" type="submit" data-i18n="formSend">Send message</button>
      <p class="form-privacy" data-i18n="formPrivacy">Your details are used only to reply to your enquiry.</p><p id="form-status" class="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
